[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "campusos"
version = "0.1.0"
description = "Intelligent campus operating system"
requires-python = ">=3.10"   # str | None union syntax requires 3.10+
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]   # lets pytest find campusos without an editable install
testpaths  = ["tests"]
